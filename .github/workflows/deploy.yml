name: Deploy HTML to Azure Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy to VM
        shell: powershell
        run: |
          pscp.exe -batch -pw "Admin@1234567" index.html admin123@20.219.15.134:/tmp/

      - name: Deploy to Nginx
        shell: powershell
        run: |
          plink.exe -batch -pw "Admin@1234567" admin123@20.219.15.134 "sudo cp /tmp/index.html /var/www/html/ && sudo chmod 644 /var/www/html/index.html && sudo systemctl reload nginx"

      - name: Verify
        shell: powershell
        run: |
          plink.exe -batch -pw "Admin@1234567" admin123@20.219.15.134 "ls -lh /var/www/html/index.html"
