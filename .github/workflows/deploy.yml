name: Deploy HTML to Azure Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nginx and Deploy
        run: |
          sudo apt-get install -y sshpass

          # Install Nginx on VM
          sshpass -p "Admin@1234567" ssh -o StrictHostKeyChecking=no admin123@20.219.15.134 "sudo apt-get update && sudo apt-get install -y nginx && sudo systemctl start nginx && sudo systemctl enable nginx"

          # Create web directory if not exists
          sshpass -p "Admin@1234567" ssh -o StrictHostKeyChecking=no admin123@20.219.15.134 "sudo mkdir -p /var/www/html"

          # Copy file
          sshpass -p "Admin@1234567" scp -o StrictHostKeyChecking=no index.html admin123@20.219.15.134:/tmp/

          # Deploy
          sshpass -p "Admin@1234567" ssh -o StrictHostKeyChecking=no admin123@20.219.15.134 "sudo cp /tmp/index.html /var/www/html/ && sudo chmod 644 /var/www/html/index.html && sudo systemctl reload nginx"

          # Verify
          sshpass -p "Admin@1234567" ssh -o StrictHostKeyChecking=no admin123@20.219.15.134 "ls -lh /var/www/html/index.html"
