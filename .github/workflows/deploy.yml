name: Deploy HTML to Azure Nginx

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PSCP
        shell: powershell
        run: |
          pscp.exe -V
          plink.exe -V

      - name: Copy index.html to Azure VM
        shell: powershell
        run: |
          pscp.exe -batch `
            -pw "Admin@1234567" `
            index.html `
            admin123@20.219.15.134:/tmp/index.html

      - name: Deploy to Nginx
        shell: powershell
        run: |
          plink.exe -batch `
            -pw "Admin@1234567" `
            admin123@20.219.15.134 `
            "sudo cp /tmp/index.html /var/www/html/index.html && sudo chmod 644 /var/www/html/index.html && sudo nginx -t && sudo systemctl reload nginx"

      - name: Verify deployment
        shell: powershell
        run: |
          plink.exe -batch `
            -pw "Admin@1234567" `
            admin123@20.219.15.134 `
            "ls -lh /var/www/html/index.html && sha256sum /var/www/html/index.html"
